<!-- Header -->
<div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4">
  <div class="flex items-center justify-between">
    <button class="text-white font-medium">Your Logo</button>
    <div class="flex items-center text-white text-sm">
      <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path>
      </svg>
      Powered by <span class="font-semibold ml-1">digio</span>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="flex-1 flex flex-col bg-gray-50">
  <!-- Title Section -->
  <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-8">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-white mb-2">{{ title }}</h1>
        <div class="flex items-center text-blue-100">
          <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
          </svg>
          <span class="text-sm">{{ subtitle }}</span>
        </div>
      </div>
      <svg class="w-6 h-6 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </div>
  </div>

  <!-- Instructions Grid -->
  <div class="flex-1 px-6 py-8">
    <div class="grid grid-cols-2 gap-4">
      <div *ngFor="let instruction of instructions" 
           class="bg-white rounded-lg p-4 shadow-sm border border-gray-100">
        <div class="flex items-start space-x-3">
          <div class="flex-shrink-0">
            <div class="w-10 h-10 rounded-lg flex items-center justify-center"
                 [ngClass]="{
                   'bg-green-100': instruction.status === 'completed',
                   'bg-blue-50': instruction.status === 'pending'
                 }">
              <svg *ngIf="instruction.icon === 'face'" class="w-5 h-5" 
                   [ngClass]="{
                     'text-green-600': instruction.status === 'completed',
                     'text-blue-600': instruction.status === 'pending'
                   }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <svg *ngIf="instruction.icon === 'network'" class="w-5 h-5" 
                   [ngClass]="{
                     'text-green-600': instruction.status === 'completed',
                     'text-blue-600': instruction.status === 'pending'
                   }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
              </svg>
              <svg *ngIf="instruction.icon === 'dress'" class="w-5 h-5" 
                   [ngClass]="{
                     'text-green-600': instruction.status === 'completed',
                     'text-blue-600': instruction.status === 'pending'
                   }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <svg *ngIf="instruction.icon === 'no-mask'" class="w-5 h-5" 
                   [ngClass]="{
                     'text-green-600': instruction.status === 'completed',
                     'text-red-600': instruction.status === 'pending'
                   }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728L5.636 5.636m12.728 12.728L18.364 5.636M5.636 18.364l12.728-12.728"></path>
              </svg>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 leading-tight">
              {{ instruction.description }}
            </p>
          </div>
          <div class="flex-shrink-0">
            <svg *ngIf="instruction.status === 'completed'" class="w-5 h-5 text-green-600" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
            </svg>
            <svg *ngIf="instruction.status === 'pending'" class="w-5 h-5 text-red-600" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Section -->
  <div class="px-6 pb-8">
    <div *ngIf="showReschedule" class="mb-6">
      <button (click)="onReschedule()" 
              class="flex items-center text-blue-600 hover:text-blue-700 text-sm font-medium">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        I would like to reschedule my Video KYC
      </button>
    </div>
    
    <button (click)="onProceed()" 
            [disabled]="!canProceed"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-3 px-6 rounded-lg transition-colors">
      {{ proceedButtonText }}
    </button>
  </div>
</div>
