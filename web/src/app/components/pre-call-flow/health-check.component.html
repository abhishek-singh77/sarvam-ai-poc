<!-- Header -->
<div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4">
    <div class="flex items-center justify-between">
        <button class="text-white font-medium">Your Logo</button>
        <div class="flex items-center text-white text-sm">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                <path
                    fill-rule="evenodd"
                    d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"
                    clip-rule="evenodd"></path>
            </svg>
            Powered by <span class="font-semibold ml-1">digio</span>
        </div>
    </div>
</div>

<!-- Main Content -->
<div class="flex-1 flex flex-col bg-gray-50">
    <!-- Title Section -->
    <div class="bg-white px-6 py-6">
        <h1 class="text-xl font-bold text-gray-900">{{ title }}</h1>
    </div>

    <!-- Health Check Items -->
    <div class="flex-1 px-6 py-4">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <div class="space-y-4">
                <div
                    *ngFor="let check of healthChecks"
                    class="flex items-center space-x-4">
                    <div class="flex-shrink-0">
                        <div
                            class="w-10 h-10 rounded-lg flex items-center justify-center"
                            [ngClass]="{
                                'bg-orange-100': check.status === 'pending',
                                'bg-blue-100': check.status === 'checking',
                                'bg-green-100': check.status === 'completed',
                                'bg-red-100': check.status === 'failed'
                            }">
                            <!-- Camera Icon -->
                            <svg
                                *ngIf="check.icon === 'camera'"
                                class="w-5 h-5"
                                [ngClass]="{
                                    'text-orange-600':
                                        check.status === 'pending',
                                    'text-blue-600':
                                        check.status === 'checking',
                                    'text-green-600':
                                        check.status === 'completed',
                                    'text-red-600': check.status === 'failed'
                                }"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>

                            <!-- Microphone Icon -->
                            <svg
                                *ngIf="check.icon === 'microphone'"
                                class="w-5 h-5"
                                [ngClass]="{
                                    'text-orange-600':
                                        check.status === 'pending',
                                    'text-blue-600':
                                        check.status === 'checking',
                                    'text-green-600':
                                        check.status === 'completed',
                                    'text-red-600': check.status === 'failed'
                                }"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                            </svg>

                            <!-- Location Icon -->
                            <svg
                                *ngIf="check.icon === 'location'"
                                class="w-5 h-5"
                                [ngClass]="{
                                    'text-orange-600':
                                        check.status === 'pending',
                                    'text-blue-600':
                                        check.status === 'checking',
                                    'text-green-600':
                                        check.status === 'completed',
                                    'text-red-600': check.status === 'failed'
                                }"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>

                            <!-- Network Icon -->
                            <svg
                                *ngIf="check.icon === 'network'"
                                class="w-5 h-5"
                                [ngClass]="{
                                    'text-orange-600':
                                        check.status === 'pending',
                                    'text-blue-600':
                                        check.status === 'checking',
                                    'text-green-600':
                                        check.status === 'completed',
                                    'text-red-600': check.status === 'failed'
                                }"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
                            </svg>

                            <!-- Browser Icon -->
                            <svg
                                *ngIf="check.icon === 'browser'"
                                class="w-5 h-5"
                                [ngClass]="{
                                    'text-orange-600':
                                        check.status === 'pending',
                                    'text-blue-600':
                                        check.status === 'checking',
                                    'text-green-600':
                                        check.status === 'completed',
                                    'text-red-600': check.status === 'failed'
                                }"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9v-9m0-9v9"></path>
                            </svg>

                            <!-- VPN Icon -->
                            <svg
                                *ngIf="check.icon === 'vpn'"
                                class="w-5 h-5"
                                [ngClass]="{
                                    'text-orange-600':
                                        check.status === 'pending',
                                    'text-blue-600':
                                        check.status === 'checking',
                                    'text-green-600':
                                        check.status === 'completed',
                                    'text-red-600': check.status === 'failed'
                                }"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                            </svg>
                        </div>
                    </div>

                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-900">
                            {{ check.name }}
                        </p>
                        <p
                            *ngIf="check.description"
                            class="text-xs text-gray-500">
                            {{ check.description }}
                        </p>
                    </div>

                    <div class="flex-shrink-0">
                        <!-- Pending State -->
                        <div
                            *ngIf="check.status === 'pending'"
                            class="w-5 h-5 rounded-full border-2 border-orange-300"></div>

                        <!-- Checking State -->
                        <div
                            *ngIf="check.status === 'checking'"
                            class="w-5 h-5">
                            <div
                                class="animate-spin rounded-full h-5 w-5 border-2 border-blue-600 border-t-transparent"></div>
                        </div>

                        <!-- Completed State -->
                        <svg
                            *ngIf="check.status === 'completed'"
                            class="w-5 h-5 text-green-600"
                            fill="currentColor"
                            viewBox="0 0 20 20">
                            <path
                                fill-rule="evenodd"
                                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                clip-rule="evenodd"></path>
                        </svg>

                        <!-- Failed State -->
                        <svg
                            *ngIf="check.status === 'failed'"
                            class="w-5 h-5 text-red-600"
                            fill="currentColor"
                            viewBox="0 0 20 20">
                            <path
                                fill-rule="evenodd"
                                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="px-6 pb-8">
        <div class="flex space-x-4">
            <button
                (click)="onCancel()"
                class="flex-1 border-2 border-blue-600 text-blue-600 hover:bg-blue-50 font-medium py-3 px-6 rounded-lg transition-colors">
                Cancel
            </button>
            <button
                (click)="onProceed()"
                [disabled]="!canProceed()"
                class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-3 px-6 rounded-lg transition-colors">
                Proceed
            </button>
        </div>
    </div>

    <!-- Permission Denied Popup -->
    <app-permission-denied-popup
        [isVisible]="showPermissionDeniedPopup"
        [deniedPermissions]="deniedPermissions"
        (retry)="onRetryHealthCheck()"
        (cancel)="onPermissionDeniedCancel()">
    </app-permission-denied-popup>
</div>
