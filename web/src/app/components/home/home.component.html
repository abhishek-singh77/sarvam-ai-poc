<!-- Home Screen -->
<div
    class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-50 to-blue-50">
    <div class="max-w-lg w-full mx-auto">
        <div
            class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl border border-gray-200/50 p-8 text-center">
            <!-- Logo -->
            <div class="mb-8">
                <div class="flex justify-center mb-6">
                    <img
                        src="assets/logos/digio_logo.svg"
                        alt="Digio Logo"
                        class="h-16 w-auto" />
                </div>
                <h1 class="text-3xl font-bold text-primary mb-3">Digio KYC</h1>
                <p class="text-gray-600 text-lg">
                    AI-Powered Identity Verification
                </p>
            </div>

            <!-- Status -->
            <div class="mb-8">
                <div
                    class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium"
                    [ngClass]="getStatusClass()">
                    <div
                        class="w-2 h-2 rounded-full mr-2"
                        [ngClass]="
                            getStatusClass().includes('green')
                                ? 'bg-green-500'
                                : 'bg-yellow-500'
                        "></div>
                    {{ status }}
                </div>
            </div>

            <!-- Media Setup Section -->
            <div *ngIf="!hasMedia" class="mb-6">
                <div
                    class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-4">
                    <div class="flex items-center">
                        <svg
                            class="w-5 h-5 text-yellow-600 mr-3 flex-shrink-0"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                        <div class="flex-1">
                            <p
                                class="text-sm text-yellow-800 font-medium leading-tight">
                                Camera & Microphone Required
                            </p>
                            <p
                                class="text-sm text-yellow-700 mt-1 leading-relaxed">
                                Please enable camera and microphone access to
                                proceed with KYC verification.
                            </p>
                        </div>
                    </div>
                </div>

                <button
                    class="w-full bg-yellow-600 hover:bg-yellow-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
                    (click)="enableMedia()"
                    [disabled]="mediaLoading">
                    <div
                        *ngIf="mediaLoading"
                        class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></div>
                    <svg
                        *ngIf="!mediaLoading"
                        class="w-5 h-5 mr-2"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    {{
                        mediaLoading
                            ? 'Enabling...'
                            : 'Enable Camera & Microphone'
                    }}
                </button>
            </div>

            <!-- Media Preview -->
            <div *ngIf="hasMedia" class="mb-6">
                <div
                    class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                    <div class="flex items-center">
                        <svg
                            class="w-5 h-5 text-green-600 mr-3 flex-shrink-0"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <div class="flex-1">
                            <p
                                class="text-sm text-green-800 font-medium leading-tight">
                                Media Access Enabled
                            </p>
                            <p
                                class="text-sm text-green-700 mt-1 leading-relaxed">
                                Camera and microphone are ready for KYC
                                verification.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Video Preview -->
                <div
                    class="relative bg-gray-200 rounded-lg overflow-hidden aspect-video">
                    <video
                        #homeVideoRef
                        playsinline
                        muted
                        autoplay
                        class="w-full h-full object-cover bg-gray-200"></video>
                </div>
            </div>

            <!-- Main Action Button -->
            <button
                class="w-full bg-primary hover:bg-primary-hover text-white font-semibold py-4 px-8 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                (click)="proceedToKYC()"
                [disabled]="isLoading || !hasMedia">
                <div *ngIf="isLoading" class="flex items-center justify-center">
                    <div
                        class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-3"></div>
                    Initializing...
                </div>
                <div
                    *ngIf="!isLoading"
                    class="flex items-center justify-center">
                    <svg
                        class="w-5 h-5 mr-3"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    Proceed to Agentic KYC
                </div>
            </button>

            <!-- Additional Info -->
            <div class="mt-6 text-sm text-gray-500">
                <p>Secure • Fast • AI-Powered</p>
            </div>

            <!-- Enterprise Dashboard Link -->
        </div>
    </div>
</div>

<!-- Error Modal -->
<app-error-modal
    [isVisible]="showErrorModal"
    [errorData]="errorModalData"
    (closeModal)="onErrorModalClose()"
    (retryAction)="onErrorModalRetry()">
</app-error-modal>
