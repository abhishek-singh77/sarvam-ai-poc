<div class="absolute inset-0 pointer-events-none">
    <!-- Modern Face Detection Square -->
    <div
        *ngIf="
            (multipleFaceDetectionResult?.primaryFace || detectionResult) &&
            captureType === 'FACE_CAPTURE'
        "
        class="absolute border-2 rounded-2xl transition-all duration-500 ease-out shadow-2xl backdrop-blur-sm"
        [ngClass]="{
            'border-emerald-400 bg-gradient-to-br from-emerald-500/30 to-green-500/20 shadow-emerald-500/60 animate-pulse':
                (multipleFaceDetectionResult?.primaryFace || detectionResult)
                    ?.steady,
            'border-amber-400 bg-gradient-to-br from-amber-500/30 to-yellow-500/20 shadow-amber-500/60':
                !(multipleFaceDetectionResult?.primaryFace || detectionResult)
                    ?.steady
        }"
        [style.left.px]="
            (multipleFaceDetectionResult?.primaryFace || detectionResult)
                ?.boundingBox?.x || 0
        "
        [style.top.px]="
            (multipleFaceDetectionResult?.primaryFace || detectionResult)
                ?.boundingBox?.y || 0
        "
        [style.width.px]="
            (multipleFaceDetectionResult?.primaryFace || detectionResult)
                ?.boundingBox?.width || 0
        "
        [style.height.px]="
            (multipleFaceDetectionResult?.primaryFace || detectionResult)
                ?.boundingBox?.height || 0
        ">
        <!-- Modern corner indicators with glow effect -->
        <div
            class="absolute -top-3 -left-3 w-6 h-6 border-t-4 border-l-4 rounded-tl-lg shadow-lg transition-all duration-300"
            [ngClass]="{
                'border-emerald-300 shadow-emerald-300/50': (
                    multipleFaceDetectionResult?.primaryFace || detectionResult
                )?.steady,
                'border-amber-300 shadow-amber-300/50': !(
                    multipleFaceDetectionResult?.primaryFace || detectionResult
                )?.steady
            }"></div>
        <div
            class="absolute -top-3 -right-3 w-6 h-6 border-t-4 border-r-4 rounded-tr-lg shadow-lg transition-all duration-300"
            [ngClass]="{
                'border-emerald-300 shadow-emerald-300/50': (
                    multipleFaceDetectionResult?.primaryFace || detectionResult
                )?.steady,
                'border-amber-300 shadow-amber-300/50': !(
                    multipleFaceDetectionResult?.primaryFace || detectionResult
                )?.steady
            }"></div>
        <div
            class="absolute -bottom-3 -left-3 w-6 h-6 border-b-4 border-l-4 rounded-bl-lg shadow-lg transition-all duration-300"
            [ngClass]="{
                'border-emerald-300 shadow-emerald-300/50': (
                    multipleFaceDetectionResult?.primaryFace || detectionResult
                )?.steady,
                'border-amber-300 shadow-amber-300/50': !(
                    multipleFaceDetectionResult?.primaryFace || detectionResult
                )?.steady
            }"></div>
        <div
            class="absolute -bottom-3 -right-3 w-6 h-6 border-b-4 border-r-4 rounded-br-lg shadow-lg transition-all duration-300"
            [ngClass]="{
                'border-emerald-300 shadow-emerald-300/50': (
                    multipleFaceDetectionResult?.primaryFace || detectionResult
                )?.steady,
                'border-amber-300 shadow-amber-300/50': !(
                    multipleFaceDetectionResult?.primaryFace || detectionResult
                )?.steady
            }"></div>

        <!-- Face detection indicator in center -->
        <div
            class="absolute inset-0 flex items-center justify-center"
            *ngIf="
                (multipleFaceDetectionResult?.primaryFace || detectionResult)
                    ?.steady
            ">
            <div
                class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center shadow-lg animate-pulse">
                <svg
                    class="w-5 h-5 text-white"
                    fill="currentColor"
                    viewBox="0 0 20 20">
                    <path
                        fill-rule="evenodd"
                        d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                        clip-rule="evenodd"></path>
                </svg>
            </div>
        </div>
    </div>
