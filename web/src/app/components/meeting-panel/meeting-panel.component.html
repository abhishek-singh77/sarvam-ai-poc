<!-- Mobile Video Layout -->
<div class="w-full h-full relative min-h-[400px]">
    <!-- Customer Video (Full Screen Background) -->
    <div class="absolute inset-0 w-full h-full min-h-[400px]">
        <div
            *ngIf="!isCustomerVideoPlaying"
            class="h-full w-full flex items-center justify-center text-white bg-gray-900">
            <div class="text-center">
                <div
                    class="animate-spin rounded-full h-8 w-8 border-b-2 border-white mx-auto mb-2"></div>
                <p class="text-sm">Loading your video...</p>
            </div>
        </div>
        <app-audio-video-track
            *ngIf="isCustomerVideoPlaying"
            #customerTrack
            [stream]="customerStream"
            class="w-full h-full object-cover"></app-audio-video-track>
    </div>

    <!-- Agent Video Overlay (Bottom Right) -->
    <div
        class="absolute bottom-4 right-4 w-24 h-32 bg-gray-800 rounded-xl overflow-hidden shadow-lg">
        <div
            *ngIf="!isAgentVideoPlaying"
            class="h-full w-full flex items-center justify-center text-white">
            <div class="text-center">
                <div
                    class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mx-auto mb-1"></div>
                <p class="text-xs">Agent</p>
            </div>
        </div>
        <app-audio-video-track
            *ngIf="isAgentVideoPlaying"
            #agentTrack
            [stream]="agentStream"
            [mirrorVideoStream]="true"
            class="w-full h-full object-cover"></app-audio-video-track>
    </div>
</div>
