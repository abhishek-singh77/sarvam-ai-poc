<!-- Responsive Video Layout -->
<div class="w-full h-full relative">
    <!-- Customer Video (Full Screen Background) -->
    <div class="absolute inset-0 w-full h-full">
        <div
            *ngIf="!isCustomerVideoPlaying"
            class="h-full w-full flex items-center justify-center text-white bg-gray-900">
            <div class="text-center">
                <div
                    class="animate-spin rounded-full h-8 w-8 border-b-2 border-white mx-auto mb-2"></div>
                <p class="text-sm">Loading your video...</p>
            </div>
        </div>
        <app-audio-video-track
            *ngIf="isCustomerVideoPlaying"
            [muted]="true"
            #customerTrack
            [stream]="customerStream"
            class="w-full h-full object-contain"></app-audio-video-track>
    </div>

    <!-- Agent Video Overlay (Bottom Right) - Responsive Size -->
    <div
        class="absolute bottom-2 right-2 sm:bottom-4 sm:right-4 bg-gray-800 rounded-xl overflow-hidden shadow-lg border-2 border-white w-24 h-32 sm:w-32 sm:h-40 md:w-40 md:h-48 lg:w-48 lg:h-56 xl:w-56 xl:h-64">
        <div
            *ngIf="!isAgentVideoPlaying"
            class="h-full w-full flex items-center justify-center text-white">
            <div class="text-center">
                <div
                    class="animate-spin rounded-full h-6 w-6 border-b-2 border-white mx-auto mb-2"></div>
                <p class="text-sm font-medium">Agent</p>
                <p class="text-xs text-gray-300">Joining...</p>
            </div>
        </div>
        <app-audio-video-track
            *ngIf="isAgentVideoPlaying"
            #agentTrack
            [stream]="agentStream"
            [mirrorVideoStream]="true"
            class="w-full h-full object-contain"></app-audio-video-track>
    </div>
</div>
