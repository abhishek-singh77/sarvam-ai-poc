<div
    class="image-manipulator-container"
    (keydown)="onKeyDown($event)"
    tabindex="0"
    role="dialog"
    aria-labelledby="image-manipulator-title"
    aria-describedby="image-manipulator-description">
    <!-- Modern Header -->
    <header
        class="bg-gradient-to-r from-blue-600 via-purple-600 to-indigo-600 px-6 py-4 rounded-t-2xl">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div
                    class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                    <svg
                        class="w-5 h-5 text-white"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h2
                    id="image-manipulator-title"
                    class="text-xl font-bold text-white">
                    Image Preview
                </h2>
            </div>
            <button
                type="button"
                [disabled]="isProcessing"
                (click)="
                    closeDialog(false, uploadSuccess ? croppedImage : undefined)
                "
                [attr.aria-label]="'Close image manipulator'"
                class="w-10 h-10 bg-white/20 hover:bg-white/30 rounded-xl flex items-center justify-center transition-all duration-300 transform hover:scale-110">
                <svg
                    class="w-5 h-5 text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Error Display -->
    <div *ngIf="hasErrors" class="error-container" role="alert">
        <div class="error-icon">
            <span class="material-symbols-outlined">error</span>
        </div>
        <div class="error-content">
            <h3>Error</h3>
            <ul>
                <li *ngFor="let error of validationErrors">{{ error }}</li>
                <li *ngIf="uploadError">{{ uploadError }}</li>
            </ul>
        </div>
    </div>
    <!-- Main Content -->
    <main class="image-manipulator-main">
        <!-- Loading State -->
        <div *ngIf="loading" class="loading-overlay" aria-live="polite">
            <app-custom-spinner [size]="32"></app-custom-spinner>
            <p>Loading image...</p>
        </div>

        <!-- Image Cropper -->
        <div class="cropper-container" id="image-manipulator-description">
            <image-cropper
                [imageBase64]="config.base64"
                [maintainAspectRatio]="
                    manipulationState.containWithinAspectRatio
                "
                [onlyScaleDown]="true"
                [roundCropper]="false"
                [canvasRotation]="manipulationState.canvasRotation"
                [transform]="manipulationState.transform"
                [alignImage]="'center'"
                [style.display]="showCropper ? null : 'none'"
                format="jpeg"
                output="blob"
                (imageCropped)="imageCropped($event)"
                (imageLoaded)="imageLoaded()"
                (cropperReady)="cropperReady($event)"
                (loadImageFailed)="loadImageFailed()"
                class="image-cropper"
                aria-label="Image cropper" />
        </div>

        <!-- Floating Zoom Controls -->
        <div class="floating-controls" aria-label="Zoom controls">
            <button
                type="button"
                [disabled]="isProcessing"
                (click)="zoomOut()"
                [attr.aria-label]="'Zoom out'"
                class="zoom-button zoom-out">
                <span class="material-symbols-outlined" aria-hidden="true"
                    >zoom_out</span
                >
            </button>
            <button
                type="button"
                [disabled]="isProcessing"
                (click)="zoomIn()"
                [attr.aria-label]="'Zoom in'"
                class="zoom-button zoom-in">
                <span class="material-symbols-outlined" aria-hidden="true"
                    >zoom_in</span
                >
            </button>
        </div>
    </main>
    <!-- Controls Section -->
    <section class="controls-section">
        <!-- Manipulation Controls -->
        <div class="manipulation-controls">
            <div class="rotation-controls">
                <button
                    type="button"
                    [disabled]="isProcessing"
                    (click)="rotateLeft()"
                    [attr.aria-label]="'Rotate left'"
                    class="control-button">
                    <span class="material-symbols-outlined" aria-hidden="true"
                        >rotate_left</span
                    >
                </button>
                <button
                    type="button"
                    [disabled]="isProcessing"
                    (click)="rotateRight()"
                    [attr.aria-label]="'Rotate right'"
                    class="control-button">
                    <span class="material-symbols-outlined" aria-hidden="true"
                        >rotate_right</span
                    >
                </button>
                <button
                    type="button"
                    [disabled]="isProcessing"
                    (click)="toggleContainWithinAspectRatio()"
                    [attr.aria-label]="'Toggle aspect ratio constraint'"
                    [attr.aria-pressed]="
                        manipulationState.containWithinAspectRatio
                    "
                    class="control-button aspect-ratio-button">
                    <span
                        class="material-symbols-outlined {{
                            !manipulationState.containWithinAspectRatio
                                ? 'aspect-ratio-off'
                                : 'aspect-ratio-on'
                        }}"
                        aria-hidden="true"
                        >aspect_ratio</span
                    >
                </button>
            </div>

            <!-- Rotation Slider -->
            <div class="rotation-slider-container">
                <label for="rotation-slider" class="slider-label">
                    <span class="material-symbols-outlined" aria-hidden="true"
                        >rotate_90_degrees_cw</span
                    >
                    Rotation: {{ manipulationState.rotation }}°
                </label>
                <input
                    id="rotation-slider"
                    type="range"
                    (input)="updateRotation($event)"
                    [value]="manipulationState.rotation"
                    min="-180"
                    max="180"
                    step="5"
                    class="rotation-slider"
                    aria-label="Image rotation slider" />
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button
                type="button"
                [disabled]="!canRetake"
                (click)="retakePhoto()"
                class="bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-400 hover:to-gray-500 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center space-x-2">
                <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Retake Photo</span>
            </button>

            <button
                type="button"
                [disabled]="!canApprove"
                (click)="approveImage(croppedImage!)"
                class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center space-x-2">
                <app-custom-spinner
                    *ngIf="uploading"
                    [size]="16"
                    aria-hidden="true"></app-custom-spinner>
                <svg
                    *ngIf="!uploading"
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5 13l4 4L19 7"></path>
                </svg>
                <span>{{
                    uploadError ? 'Retry Upload' : 'Approve Image'
                }}</span>
            </button>
        </div>
    </section>

    <!-- Status Messages -->
    <div
        *ngIf="uploading"
        class="bg-blue-50 border border-blue-200 rounded-xl p-4 mx-6 mb-4 flex items-center space-x-3"
        aria-live="polite">
        <app-custom-spinner [size]="20"></app-custom-spinner>
        <span class="text-blue-700 font-medium">Uploading image...</span>
    </div>

    <div
        *ngIf="uploadSuccess"
        class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mx-6 mb-4 flex items-center space-x-3"
        aria-live="polite">
        <div
            class="w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center">
            <svg
                class="w-4 h-4 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24">
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <span class="text-emerald-700 font-medium"
            >Image uploaded successfully!</span
        >
    </div>

    <!-- Analysis Results -->
    <app-analysis-display
        *ngIf="showAnalysisResults && analysisData"
        [analysisData]="analysisData"
        [showActions]="true"
        (retakeRequested)="onAnalysisRetake()"
        (continueRequested)="onAnalysisContinue()">
    </app-analysis-display>
</div>
