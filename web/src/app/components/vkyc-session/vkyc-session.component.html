<app-vkyc-session-layout
    [state]="layoutState"
    [preCallFlowService]="preCallFlowService"
    (endSession)="endSession()"
    (instructionsProceed)="onInstructionsProceed()"
    (instructionsReschedule)="onInstructionsReschedule()"
    (instructionsCancel)="onInstructionsCancel()"
    (consentProceed)="onConsentProceed()"
    (consentCancel)="onConsentCancel()"
    (healthCheckProceed)="onHealthCheckProceed()"
    (healthCheckCancel)="onHealthCheckCancel()"
    (voiceRecognition)="startVoiceRecognition($event)"
    (questionnaireRetry)="onHealthCheckCancel()"
    (questionnaireSubmit)="submitQuestionnaire()"
    (startCall)="startCall()">
</app-vkyc-session-layout>

<!-- Image Manipulator Modal -->
<div
    *ngIf="showImageManipulator"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
        <h3 class="text-lg font-medium text-gray-900 mb-4">
            Image Manipulator
        </h3>
        <p class="text-gray-600 mb-4">
            Image manipulation functionality will be implemented here.
        </p>
        <button
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg"
            (click)="showImageManipulator = false">
            Close
        </button>
    </div>
</div>

<!-- Error Modal -->
<div
    *ngIf="showErrorModal"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
        <h3 class="text-lg font-medium text-red-600 mb-4">Error</h3>
        <p class="text-gray-600 mb-4">{{ errorMessage }}</p>
        <button
            class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg"
            (click)="showErrorModal = false">
            Close
        </button>
    </div>
</div>

<!-- Custom Spinner -->
<div
    *ngIf="isAgentLoading"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 text-center">
        <div
            class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
        <h3 class="text-lg font-medium text-gray-900 mb-2">Loading Agent</h3>
        <p class="text-gray-600">
            Step {{ agentLoadingStep }}:
            {{ getLogMessage(agentLoadingStep.toString()) }}
        </p>
    </div>
</div>
