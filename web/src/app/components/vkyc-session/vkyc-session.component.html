<app-vkyc-session-layout
    [state]="layoutState"
    [preCallFlowService]="preCallFlowService"
    (endSession)="endSession()"
    (instructionsProceed)="onInstructionsProceed()"
    (instructionsReschedule)="onInstructionsReschedule()"
    (instructionsCancel)="onInstructionsCancel()"
    (consentProceed)="onConsentProceed()"
    (consentCancel)="onConsentCancel()"
    (healthCheckProceed)="onHealthCheckProceed($event)"
    (healthCheckCancel)="onHealthCheckCancel()"
    (voiceRecognition)="startVoiceRecognition($event)"
    (questionnaireRetry)="onQuestionnaireRetry()"
    (questionnaireSubmit)="submitQuestionnaire()"
    (startCall)="startCall()"
    (chatToggle)="onChatToggle()"
    (cameraToggle)="onCameraToggle()"
    (capturePhoto)="onCapturePhoto()"
    (agentResponseSubmitted)="onAgentResponseSubmitted($event)"
    (agentResponseUpdated)="onAgentResponseUpdated($event)"
    (agentProceed)="onAgentProceed()"
    (nextStep)="onNextStep()"
    (questionnaireCompleted)="onQuestionnaireCompleted($event)"
    (startImageCapture)="onStartImageCapture()"
    (finishKyc)="onFinishKyc()">
</app-vkyc-session-layout>

<!-- Image Manipulator Modal -->
<div
    *ngIf="showImageManipulator"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div
        class="bg-white rounded-lg p-4 sm:p-6 w-full max-w-sm sm:max-w-md md:max-w-lg lg:max-w-4xl max-h-[95vh] overflow-auto">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-medium text-gray-900">Edit Your Photo</h3>
            <button
                class="text-gray-400 hover:text-gray-600 p-1"
                (click)="onImageManipulatorClose()">
                <svg
                    class="w-6 h-6"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <lib-image-manipulator
            [config]="getImageManipulatorConfig()"
            (imageProcessed)="onImageProcessed($event)"
            (error)="onImageManipulatorError($event)"
            (imageRetake)="onImageRetake()"
            (imageClosed)="onImageClosed()">
        </lib-image-manipulator>
    </div>
</div>

<!-- Modern Error Modal -->
<div
    *ngIf="showErrorModal"
    class="fixed inset-0 bg-gradient-to-br from-red-900/80 via-orange-900/60 to-yellow-900/80 backdrop-blur-md flex items-center justify-center z-50">
    <div class="relative animate-scale-in">
        <!-- Glassmorphism error container -->
        <div
            class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl">
            <!-- Animated background gradient -->
            <div
                class="absolute inset-0 bg-gradient-to-br from-red-500/20 via-orange-500/20 to-yellow-500/20 rounded-2xl"></div>

            <!-- Content -->
            <div class="relative z-10">
                <div class="flex items-center mb-6">
                    <div class="flex-shrink-0">
                        <!-- Modern error icon with animation -->
                        <div
                            class="w-12 h-12 bg-red-500/20 rounded-full flex items-center justify-center animate-pulse">
                            <svg
                                class="h-6 w-6 text-red-400"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="ml-4">
                        <h3 class="text-xl font-bold text-white">
                            Oops! Something went wrong
                        </h3>
                    </div>
                </div>

                <div class="mb-8">
                    <p class="text-white/90 text-base leading-relaxed">
                        {{ errorMessage }}
                    </p>
                </div>

                <div class="flex justify-end">
                    <button
                        (click)="showErrorModal = false"
                        class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white px-6 py-3 rounded-xl text-sm font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                        Got it
                    </button>
                </div>
            </div>
        </div>

        <!-- Floating error particles -->
        <div
            class="absolute -top-2 -left-2 w-4 h-4 bg-red-400/30 rounded-full animate-bounce"></div>
        <div
            class="absolute -bottom-2 -right-2 w-3 h-3 bg-orange-400/30 rounded-full animate-bounce delay-300"></div>
    </div>
</div>
