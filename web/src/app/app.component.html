<div
    class="min-h-screen"
    [ngClass]="
        currentRoute === '/home' || currentRoute === '/'
            ? ''
            : 'bg-gradient-to-br from-slate-50 to-blue-50'
    ">
    <!-- Header (only for non-home routes) -->
    <header
        *ngIf="currentRoute !== '/home' && currentRoute !== '/'"
        class="bg-white/95 backdrop-blur-sm shadow-sm border-b border-gray-200/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <img
                            src="assets/logos/digio_logo.svg"
                            alt="Digio Logo"
                            class="h-8 w-auto" />
                    </div>
                    <div class="ml-4">
                        <div class="text-lg font-semibold text-primary">
                            Digio KYC Platform
                        </div>
                        <div class="text-sm text-gray-500">
                            AI-Powered Video Verification
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- Session Status (only in KYC mode) -->
                    <div
                        *ngIf="currentRoute === '/kyc'"
                        class="flex items-center px-3 py-1 rounded-full text-sm font-medium"
                        [ngClass]="getStatusClass()">
                        <div
                            class="w-2 h-2 rounded-full mr-2"
                            [ngClass]="
                                getStatusClass().includes('green')
                                    ? 'bg-green-500'
                                    : getStatusClass().includes('red')
                                    ? 'bg-red-500'
                                    : 'bg-yellow-500'
                            "></div>
                        {{ status }}
                    </div>
                    <!-- Backend Info -->
                    <div
                        class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
                        Backend: {{ apiBase }}
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1">
        <router-outlet></router-outlet>
    </main>

    <!-- Notification Toast -->
    <app-notification></app-notification>
</div>
